name: ecomap
description: A new Flutter project.

environment:
  sdk: '>=3.2.6 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^8.0.0
  latlong2: ^0.9.1
  sqflite: ^2.3.0
  path_provider: ^2.1.0
  geolocator: ^13.0.0
  http: ^1.2.0
  fl_chart: ^0.70.2
  firebase_core: ^3.0.0
  cloud_firestore: ^5.0.0
  image_picker: ^1.1.2
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/eco_zone.geojson
    - assets/feuillets_index.geojson
    - assets/logo.png